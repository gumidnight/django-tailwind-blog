{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Navbar -->
    <nav class="bg-gray-800 shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-cyan-400">My Portfolio</a>
            <ul class="flex space-x-6">
                <li><a href="/" class="hover:text-cyan-400">Home</a></li>
                <li><a href="/projects/" class="hover:text-cyan-400">Projects</a></li>
                <li><a href="/certifications/" class="hover:text-cyan-400">Certifications</a></li>
                <li><a href="/contact/" class="hover:text-cyan-400">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-center py-4 mt-10">
        <p class="text-gray-400">&copy; {{ now|date:"Y" }} My Portfolio. All rights reserved.</p>
    </footer>

    <!-- TinyMCE only where needed -->
    {% block extra_js %}
    {% endblock %}
</body>
</html>
